
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#B8962E;--gold2:#D4AF5A;--gold3:#8A6E20;--deep:#1A1410;--border:rgba(184,150,46,0.22);--border2:rgba(184,150,46,0.4)}
.app{font-family:'Jost',sans-serif;color:var(--deep);background:transparent}

.splash{min-height:520px;background:var(--color-background-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 2rem;position:relative;overflow:hidden;border-bottom:0.5px solid var(--border)}
.splash-ornament{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.splash-center{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:0}
.splash-eyebrow{font-size:10px;letter-spacing:0.4em;text-transform:uppercase;color:var(--gold);font-weight:400;margin-bottom:18px}
.splash-brand{font-family:'Cormorant Garamond',serif;font-size:72px;font-weight:300;letter-spacing:0.12em;color:var(--color-text-primary);line-height:1;margin-bottom:6px}
.splash-brand em{color:var(--gold);font-style:italic}
.splash-tagline{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:300;font-style:italic;color:var(--color-text-secondary);letter-spacing:0.08em;margin-bottom:36px}
.splash-divider{display:flex;align-items:center;gap:12px;margin-bottom:36px}
.splash-divider-line{width:60px;height:0.5px;background:var(--gold)}
.splash-divider-gem{width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.splash-cta{background:var(--deep);color:#fff;border:none;padding:14px 40px;font-size:11px;letter-spacing:0.25em;text-transform:uppercase;cursor:pointer;font-family:'Jost',sans-serif;border-radius:0;transition:all 0.3s;position:relative}
.splash-cta:hover{background:var(--gold)}
.splash-cta::after{content:'';position:absolute;inset:-4px;border:0.5px solid var(--border2);pointer-events:none}
.splash-scroll{margin-top:28px;font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:var(--color-text-secondary);display:flex;align-items:center;gap:8px}
.scroll-line{width:1px;height:28px;background:var(--border2);animation:scrollpulse 2s ease-in-out infinite}
@keyframes scrollpulse{0%,100%{opacity:0.3;transform:scaleY(0.6) translateY(-4px)}50%{opacity:1;transform:scaleY(1) translateY(0)}}
.splash-badges{display:flex;gap:24px;margin-bottom:36px;margin-top:4px}
.badge{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--color-text-secondary);display:flex;align-items:center;gap:6px}
.badge-dot{width:4px;height:4px;border-radius:50%;background:var(--gold)}

.header{padding:1.2rem 2rem 1rem;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--color-background-primary);display:none}
.logo{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;letter-spacing:0.18em;color:var(--color-text-primary)}
.logo em{color:var(--gold);font-style:italic}
.cart-btn{background:none;border:0.5px solid var(--border);border-radius:20px;padding:6px 14px;font-size:11px;letter-spacing:0.08em;cursor:pointer;color:var(--color-text-secondary);font-family:'Jost',sans-serif;display:flex;align-items:center;gap:6px;transition:all 0.2s}
.cart-btn:hover{border-color:var(--gold);color:var(--gold)}
.cart-count{background:var(--gold);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center}
.nav{display:flex;padding:0 2rem;border-bottom:0.5px solid var(--border);background:var(--color-background-primary);overflow-x:auto;display:none}
.nav-btn{background:none;border:none;padding:12px 16px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;color:var(--color-text-secondary);font-family:'Jost',sans-serif;border-bottom:1.5px solid transparent;transition:all 0.2s;white-space:nowrap}
.nav-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.nav-btn:hover{color:var(--color-text-primary)}

.main-view{display:none}
.filter-bar{display:flex;gap:8px;padding:1rem 2rem 0;overflow-x:auto;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{background:none;border:0.5px solid var(--color-border-tertiary);border-radius:16px;padding:5px 14px;font-size:11px;letter-spacing:0.08em;cursor:pointer;color:var(--color-text-secondary);font-family:'Jost',sans-serif;white-space:nowrap;transition:all 0.2s}
.filter-chip.active,.filter-chip:hover{border-color:var(--gold);color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:1px;background:var(--border);margin:1.5rem 2rem}
.card{background:var(--color-background-primary);padding:1.25rem;cursor:pointer;transition:background 0.2s;position:relative}
.card:hover{background:var(--color-background-secondary)}
.card:hover .card-add{opacity:1}
.card-img{width:100%;aspect-ratio:1;background:var(--color-background-secondary);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:38px;margin-bottom:12px;position:relative}
.card-badge{position:absolute;top:8px;left:8px;background:var(--gold);color:#fff;font-size:9px;letter-spacing:0.1em;padding:3px 7px;border-radius:2px;text-transform:uppercase}
.card-name{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:400;color:var(--color-text-primary);margin-bottom:3px}
.card-material{font-size:11px;color:var(--color-text-secondary);letter-spacing:0.05em;margin-bottom:10px}
.card-footer{display:flex;align-items:center;justify-content:space-between}
.card-price{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.card-add{opacity:0;background:var(--gold);color:#fff;border:none;border-radius:50%;width:28px;height:28px;font-size:16px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center}
.card-add:hover{background:var(--gold3);transform:scale(1.1)}

.detail-view{padding:2rem;display:none}
.back-btn{background:none;border:none;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-text-secondary);cursor:pointer;font-family:'Jost',sans-serif;display:flex;align-items:center;gap:6px;margin-bottom:1.5rem;padding:0}
.back-btn:hover{color:var(--color-text-primary)}
.detail-layout{display:grid;grid-template-columns:1fr 1fr;gap:2rem}
.detail-img{aspect-ratio:1;background:var(--color-background-secondary);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:80px}
.detail-name{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:var(--color-text-primary);margin-bottom:6px}
.detail-mat{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.detail-desc{font-size:14px;color:var(--color-text-secondary);line-height:1.75;margin-bottom:20px}
.detail-price{font-size:24px;font-weight:500;color:var(--color-text-primary);margin-bottom:20px}
.size-label{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-text-secondary);margin-bottom:8px}
.sizes{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.size-btn{border:0.5px solid var(--color-border-tertiary);background:none;padding:6px 14px;font-size:12px;cursor:pointer;font-family:'Jost',sans-serif;color:var(--color-text-secondary);border-radius:4px;transition:all 0.2s}
.size-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(184,150,46,0.07)}
.add-btn{width:100%;background:var(--deep);color:#fff;border:none;padding:14px;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;font-family:'Jost',sans-serif;border-radius:4px;transition:background 0.2s}
.add-btn:hover{background:var(--gold)}
.specs{margin-top:1.5rem;border-top:0.5px solid var(--border);padding-top:1.5rem}
.spec-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:0.5px solid var(--border)}
.spec-l{color:var(--color-text-secondary)}

.cart-view{padding:2rem;display:none}
.cart-item{display:flex;gap:16px;padding:16px 0;border-bottom:0.5px solid var(--border);align-items:center}
.cart-thumb{width:60px;height:60px;background:var(--color-background-secondary);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.cart-info{flex:1}
.cart-item-name{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--color-text-primary)}
.cart-item-meta{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
.cart-remove{background:none;border:none;color:var(--color-text-secondary);cursor:pointer;font-size:18px;padding:4px;transition:color 0.2s}
.cart-remove:hover{color:var(--gold)}
.cart-total-row{padding:1.5rem 0;display:flex;justify-content:space-between;align-items:center;border-top:0.5px solid var(--border);margin-top:0.5rem}
.checkout-btn{width:100%;background:var(--gold);color:#fff;border:none;padding:14px;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;font-family:'Jost',sans-serif;border-radius:4px;transition:background 0.2s}
.checkout-btn:hover{background:var(--gold3)}
.empty-cart{text-align:center;padding:3rem 1rem;color:var(--color-text-secondary);font-size:13px;letter-spacing:0.05em}

.toast{position:absolute;bottom:24px;right:24px;background:var(--deep);color:#fff;padding:10px 18px;border-radius:4px;font-size:11px;letter-spacing:0.08em;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
@media(max-width:480px){.detail-layout{grid-template-columns:1fr}.splash-brand{font-size:48px}}
</style>

<script>
const products=[
  {id:1,name:'Soleil Ring',material:'18K Yellow Gold',price:1840,category:'rings',tag:'new',emoji:'💍',desc:'A radiant solitaire ring featuring a brilliant-cut diamond in polished 18K yellow gold. Understated elegance, timeless design.',specs:{Metal:'18K Yellow Gold',Stone:'Diamond 0.5ct',Setting:'Prong set',Width:'2.8mm'},sizes:['5','6','7','8','9']},
  {id:2,name:'Luna Pendant',material:'Sterling Silver & Pearl',price:420,category:'necklaces',tag:'',emoji:'📿',desc:'Lustrous freshwater pearl suspended from a delicate sterling silver chain. A piece that moves with you.',specs:{Metal:'Sterling Silver',Stone:'Freshwater Pearl',Chain:'42cm',Weight:'3.2g'},sizes:['42cm','45cm','50cm']},
  {id:3,name:'Celeste Hoops',material:'14K Rose Gold',price:680,category:'earrings',tag:'new',emoji:'🔮',desc:'Softly polished rose gold hoops with a satin finish interior. Light-catching and effortlessly wearable.',specs:{Metal:'14K Rose Gold',Diameter:'30mm',Closure:'Hinged',Weight:'4.1g per pair'},sizes:['One size']},
  {id:4,name:'Éclat Bracelet',material:'18K Gold & Diamonds',price:2950,category:'bracelets',tag:'',emoji:'✨',desc:'A continuous line of pavé diamonds set in 18K gold — pure brilliance that encircles the wrist.',specs:{Metal:'18K Yellow Gold',Stones:'Diamonds 1.2ct total',Length:'18cm',Clasp:'Hidden box clasp'},sizes:['16cm','17cm','18cm','19cm']},
  {id:5,name:'Borealis Ring',material:'14K White Gold & Sapphire',price:1240,category:'rings',tag:'',emoji:'💙',desc:'A cornflower blue sapphire flanked by diamond baguettes in 14K white gold. Inspired by the northern lights.',specs:{Metal:'14K White Gold',Center:'Sapphire 1.1ct',Accent:'Diamond baguettes',Width:'3.5mm'},sizes:['5','6','7','8','9']},
  {id:6,name:'Aura Choker',material:'Sterling Silver',price:290,category:'necklaces',tag:'new',emoji:'⭕',desc:'A sculptural sterling silver choker with a subtle hammered texture. Contemporary yet classic.',specs:{Metal:'Sterling Silver 925',Length:'38cm + 5cm ext.',Width:'4mm',Finish:'Hammered'},sizes:['One size']},
  {id:7,name:'Miel Studs',material:'18K Gold & Citrine',price:560,category:'earrings',tag:'',emoji:'🌟',desc:'Warm citrine stones bezel-set in polished 18K gold — like drops of sunlight on the ear.',specs:{Metal:'18K Yellow Gold',Stone:'Citrine 0.6ct each',Setting:'Bezel',Back:'Push back'},sizes:['One size']},
  {id:8,name:'Cascade Cuff',material:'Sterling Silver',price:380,category:'bracelets',tag:'',emoji:'🌊',desc:'A fluid open-ended cuff in sterling silver with a flowing wave motif. Adjustable to fit most wrists.',specs:{Metal:'Sterling Silver 925',Width:'8mm',Opening:'30mm',Finish:'Polish + satin'},sizes:['One size']},
];
let cart=[],currentFilter='all',currentCat='all';

function enterStore(){
  document.getElementById('splash').style.display='none';
  document.getElementById('header').style.display='flex';
  document.getElementById('mainnav').style.display='flex';
  document.getElementById('main-view').style.display='block';
  renderGrid();
}
function filteredProducts(){
  return products.filter(p=>{
    const c=currentCat==='all'||p.category===currentCat;
    const f=currentFilter==='all'||(currentFilter==='new'&&p.tag==='new')||(currentFilter==='gold'&&p.material.toLowerCase().includes('gold'))||(currentFilter==='silver'&&p.material.toLowerCase().includes('silver'))||(currentFilter==='gemstone'&&['sapphire','diamond','citrine','pearl'].some(g=>p.material.toLowerCase().includes(g)));
    return c&&f;
  });
}
function renderGrid(){
  const g=document.getElementById('product-grid');
  const items=filteredProducts();
  g.innerHTML=items.map(p=>`<div class="card" onclick="showDetail(${p.id})"><div class="card-img">${p.tag?`<div class="card-badge">${p.tag}</div>`:''}<span style="font-size:38px">${p.emoji}</span></div><div class="card-name">${p.name}</div><div class="card-material">${p.material}</div><div class="card-footer"><div class="card-price">₹${(p.price*83).toLocaleString('en-IN')}</div><button class="card-add" onclick="event.stopPropagation();quickAdd(${p.id},this)">+</button></div></div>`).join('');
  if(!items.length)g.innerHTML='<div style="grid-column:1/-1;padding:2rem;text-align:center;color:var(--color-text-secondary);font-size:13px">No pieces match your selection</div>';
}
function showDetail(id){
  const p=products.find(x=>x.id===id);
  document.getElementById('main-view').style.display='none';
  document.getElementById('cart-view').style.display='none';
  const dv=document.getElementById('detail-view');
  dv.style.display='block';
  dv.innerHTML=`<button class="back-btn" onclick="backToMain()">← Back</button><div class="detail-layout"><div class="detail-img"><span>${p.emoji}</span></div><div><div class="detail-name">${p.name}</div><div class="detail-mat">${p.material}</div><div class="detail-desc">${p.desc}</div><div class="detail-price">₹${(p.price*83).toLocaleString('en-IN')}</div><div class="size-label">${p.category==='rings'?'Ring size':p.category==='necklaces'||p.category==='bracelets'?'Length':'Size'}</div><div class="sizes">${p.sizes.map((s,i)=>`<button class="size-btn${i===0?' active':''}" onclick="selSize(this)">${s}</button>`).join('')}</div><button class="add-btn" onclick="addFromDetail(${p.id})">Add to cart</button><div class="specs">${Object.entries(p.specs).map(([k,v])=>`<div class="spec-row"><span class="spec-l">${k}</span><span>${v}</span></div>`).join('')}</div></div></div>`;
}
function selSize(btn){btn.closest('.sizes').querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
function addFromDetail(id){
  const p=products.find(x=>x.id===id);
  const s=document.querySelector('.size-btn.active');
  cart.push({...p,size:s?s.textContent:'One size',uid:Date.now()});
  updateCount();showToast(`${p.name} added to cart`);
}
function quickAdd(id,btn){
  const p=products.find(x=>x.id===id);
  cart.push({...p,size:p.sizes[0],uid:Date.now()});
  updateCount();showToast(`${p.name} added`);
}
function updateCount(){document.getElementById('cart-count').textContent=cart.length}
function showCart(){
  document.getElementById('main-view').style.display='none';
  document.getElementById('detail-view').style.display='none';
  const cv=document.getElementById('cart-view');
  cv.style.display='block';
  if(!cart.length){cv.innerHTML=`<button class="back-btn" onclick="backToMain()">← Continue shopping</button><div class="empty-cart">Your cart is empty</div>`;return}
  const total=cart.reduce((s,i)=>s+i.price*83,0);
  cv.innerHTML=`<button class="back-btn" onclick="backToMain()">← Continue shopping</button><div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;margin-bottom:1.5rem;color:var(--color-text-primary)">Your cart (${cart.length})</div>${cart.map(i=>`<div class="cart-item"><div class="cart-thumb">${i.emoji}</div><div class="cart-info"><div class="cart-item-name">${i.name}</div><div class="cart-item-meta">${i.material} · Size ${i.size}</div></div><div style="font-size:14px;font-weight:500;color:var(--color-text-primary)">₹${(i.price*83).toLocaleString('en-IN')}</div><button class="cart-remove" onclick="removeItem(${i.uid})">×</button></div>`).join('')}<div class="cart-total-row"><span style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-text-secondary)">Total</span><span style="font-size:22px;font-family:'Cormorant Garamond',serif;font-weight:300;color:var(--color-text-primary)">₹${total.toLocaleString('en-IN')}</span></div><button class="checkout-btn" onclick="showToast('Checkout coming soon — thank you!')">Proceed to checkout</button>`;
}
function removeItem(uid){cart=cart.filter(i=>i.uid!==uid);updateCount();showCart()}
function backToMain(){document.getElementById('detail-view').style.display='none';document.getElementById('cart-view').style.display='none';document.getElementById('main-view').style.display='block'}
function setNav(btn,cat){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentCat=cat;renderGrid()}
function setFilter(btn,f){document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentFilter=f;renderGrid()}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
</script>
